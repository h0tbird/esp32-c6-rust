[package]
edition      = "2024"
name         = "esp32-c6-starter"
default-run  = "esp32-c6-starter"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp32-c6-starter"
path = "./src/bin/main.rs"

[[bin]]
name = "matter-thread"
path = "./src/bin/matter_thread.rs"
required-features = ["matter-thread"]
test = false
bench = false

[features]
matter-thread = [
  "dep:esp-alloc",
  "dep:esp-radio",
  "dep:esp-metadata-generated",
  "dep:portable-atomic",
  "dep:rs-matter-embassy",
  "dep:static_cell",
  "dep:tinyrlibc",
  "esp-hal/exception-handler",
  "esp-rtos/esp-radio",
  "esp-rtos/esp-alloc",
]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c6", "unstable"] }


defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c6"] }
smart-leds = "0.4.0"
esp-hal-smartled = { version = "0.18.0", features = ["esp32c6"] }
esp-rtos = { version = "0.4.0", features = ["esp32c6", "embassy", "defmt"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"

esp-alloc = { version = "0.11", features = ["esp32c6"], optional = true }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "ble", "unstable", "defmt"], optional = true }
esp-metadata-generated = { version = "0.5", features = ["esp32c6"], optional = true }
portable-atomic = { version = "1", features = ["critical-section"], optional = true }
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "2a806b0b1b521293b34a773618499e87402c843c", default-features = false, features = ["esp", "trouble", "openthread", "mbedtls", "openthread-heap-int-8192", "defmt"], optional = true }
static_cell = { version = "2", optional = true }
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"], optional = true }

[patch.crates-io]
openthread = { git = "https://github.com/esp-rs/openthread", rev = "b01e7e63a48943d060e971e7ea364a84609c7ffb" }
openthread-sys = { git = "https://github.com/esp-rs/openthread", rev = "b01e7e63a48943d060e971e7ea364a84609c7ffb" }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
